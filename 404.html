<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 404 - Halcon Space</title>
    <link rel="stylesheet" href="css/404.css">
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
    <style>
        .error-container {
    text-align: center;
}

.error-container h1 {
    font-size: 6rem;
    color: #c1272d;
    margin: 0;
}

.error-container p {
    font-size: 1.5rem;
    margin: 10px 0 20px;
}

.error-container a {
    color: #ffffff;
    text-decoration: none;
    border: 2px solid #c1272d;
    padding: 10px 20px;
    font-size: 1.2rem;
    border-radius: 5px;
    transition: all 0.3s ease;
}

.error-container a:hover {
    background-color: #c1272d;
    color: #ffffff;
}

.error-container img {
    max-width: 250px;
    margin-bottom: 20px;
}
    </style>
</head>
<body>
    <!-- Encabezado -->
    <div id="menu-container"></div>
    <script src="js/menu.js"></script>
    
    <div class="error-container">
        <img src="img/logo.png" alt="Logo Halcon Space">
        <h1>404</h1>
        <p>¡Oops! La página que buscas no está disponible.</p>
        <a href="https://halconspace.site/">Volver al inicio</a>
    </div>
    <div style="height: 150px"></div>

    <footer>
        <p>&copy; 2025 Halcon Space. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
