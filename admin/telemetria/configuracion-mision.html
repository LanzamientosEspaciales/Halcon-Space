<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Misión - Halcon Space</title>
    <link rel="stylesheet" href="../../css/estilo.css">
    <link rel="stylesheet" href="css/configuracion.css">
</head>
<body>

    <div id="menu-container"></div>
    <script src="js/menu.js"></script>

    <section class="configuracion">
        <h2>Configuración de Misión</h2>

        <div class="formulario">
            <!-- General -->
            <label for="vehiculo">Nombre del Vehículo:</label>
            <input type="text" id="vehiculo" value="Falcon 9 Block 5">

            <label for="mision">Nombre de la Misión:</label>
            <input type="text" id="mision" value="Lanzamiento GPS-3">

            <label for="plataforma">Plataforma de Lanzamiento:</label>
            <input type="text" id="plataforma" value="LZ-39A">

            <label for="vehiculo-estado">Estado del Vehículo:</label>
            <input type="text" id="vehiculo-estado" value="✅ Listo">

            <label for="comunicaciones">Comunicaciones:</label>
            <input type="text" id="comunicaciones" value="✅ Estable">

            <label for="camaras">Cámaras:</label>
            <input type="text" id="camaras" value="✅ Operativas">

            <label for="range">Range:</label>
            <input type="text" id="range" value="1000 km">

            <!-- Etapa 2 -->
            <label for="propulsion-2">Propulsión (Etapa 2):</label>
            <input type="text" id="propulsion-2" value="✅ Estable">

            <label for="rp1-2">Carga de Queroseno Líquido (RP1) (Etapa 2):</label>
            <input type="text" id="rp1-2" value="85%">

            <label for="lox-2">Carga de Oxígeno Líquido (LOx) (Etapa 2):</label>
            <input type="text" id="lox-2" value="90%">

            <label for="navegacion-2">Navegación (Etapa 2):</label>
            <input type="text" id="navegacion-2" value="✅ Estable">

            <label for="comunicaciones-2">Comunicaciones (Etapa 2):</label>
            <input type="text" id="comunicaciones-2" value="✅ Estable">

            <label for="baterias-2">Baterías (Etapa 2):</label>
            <input type="text" id="baterias-2" value="90%">

            <!-- Etapa 1 -->
            <label for="propulsion-1">Propulsión (Etapa 1):</label>
            <input type="text" id="propulsion-1" value="✅ Estable">

            <label for="rp1-1">Carga de Queroseno Líquido (RP1) (Etapa 1):</label>
            <input type="text" id="rp1-1" value="80%">

            <label for="lox-1">Carga de Oxígeno Líquido (LOx) (Etapa 1):</label>
            <input type="text" id="lox-1" value="85%">

            <label for="navegacion-1">Navegación (Etapa 1):</label>
            <input type="text" id="navegacion-1" value="✅ Estable">

            <label for="comunicaciones-1">Comunicaciones (Etapa 1):</label>
            <input type="text" id="comunicaciones-1" value="✅ Estable">

            <label for="baterias-1">Baterías (Etapa 1):</label>
            <input type="text" id="baterias-1" value="88%">

            <label for="recuperacion-1">Recuperación (Etapa 1):</label>
            <input type="text" id="recuperacion-1" value="✅ Preparada">

            <!-- Meteorología -->
            <label for="viento">Velocidad del Viento:</label>
            <input type="text" id="viento" value="25 km/h">

            <label for="temperatura-meteorologica">Temperatura:</label>
            <input type="text" id="temperatura-meteorologica" value="20 °C">

            <label for="humedad">Humedad:</label>
            <input type="text" id="humedad" value="65%">

            <label for="nubosidad">Nubosidad:</label>
            <input type="text" id="nubosidad" value="50%">

            <button class="guardar-btn" onclick="guardarConfiguracion()">Guardar Configuración</button>
        </div>
    </section>

    <script src="js/configuracion.js"></script>
</body>
</html>
