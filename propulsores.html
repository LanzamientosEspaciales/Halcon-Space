<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propulsores • Halcon Space</title>
    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="css/propulsores.css">
    <link rel="stylesheet" href="css/estilo.css">

    <!-- Título de la página -->
   <meta property="og:title" content="Propulsores • Halcon Space">
   
   <!-- Descripción que aparecerá en el embed -->
   <meta property="og:description" content="Propulsores de Halcon Space">
   
   <!-- URL de la página -->
   <meta property="og:url" content="https://halconspace.site/propulsores/">
   
   <!-- Imagen para el embed (recomendado 1200x630 píxeles) -->
   <meta property="og:image" content="https://halconspace.site/img/propulsores/B1075.png">
   
   <!-- Tipo de contenido (website, article, video, etc.) -->
   <meta property="og:type" content="website">
 
   <meta property="website:author" content="Halcon Space">
   <meta property="website:section" content="Propulsores">
   
   <!-- Idioma y región opcionales -->
   <meta property="og:locale" content="es_ES">
</head>
<body>
    <!-- Encabezado -->
    <div id="menu-container"></div>
    <script src="../js/menu.js"></script>

    <h2 style="text-align: center;">Selecciona un propulsor</h2>
    <div class="filtros">
      <section class="filtro-nombre">
          <input type="text" id="searchInput" class="searchInput" placeholder="Buscar por tipo o numero de serie">
      </section>

      <section class="filtro-estado">
        <select id="estado">
          <option value="todos">Todos</option>
          <option value="activo">Activo</option>
          <option value="retirado">Retirado</option>
          <option value="destruido">Destruido</option>
        </select>        
      </section>
  </div>

    <section>
    <!-- Tarjetas de vuelos -->
    
    <div class="gallery" id="gallery">

        <!-- ACA CARGAN LOS VUELOS -->
        
    </div>

    <div id="modal" class="modal oculto">
        <div class="modal-content">
          <span class="close-button">&times;</span>
          <h2 id="modal-title">Vuelos del propulsor</h2>
          <ul id="modal-vuelos"></ul>
        </div>
      </div>
      
</section>
<script src="js/propulsores.js"></script>
</body>
</html>
